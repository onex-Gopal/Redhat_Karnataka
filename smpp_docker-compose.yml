services:
  smpp:
    image: omni_v2_sprint_w27_28
    container_name: smpp
    restart: unless-stopped

    volumes:
      - smpp_9999:/work/smsc/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    environment:
      REGISTRY_IP: "192.168.83.30"
      REGISTRY_PORT: "16000"
      DOCKER_IP: "192.168.83.30"
      DOCKER_PORT: "9999"
      FRQ_CP_REDIS_IP: "192.168.83.30"
      FRQ_CP_REDIS_PORT: "6379"
      FRQ_CP_REDIS_PWD: "password"
      DOCKER_COWBOY_PORT: "10500"
      NODE_COOKIE: "test"

    ports:
      - "192.168.83.30:9999:9999"
      - "192.168.83.30:10500:10500"

    logging:
      driver: "none"

volumes:
  smpp_9999:
